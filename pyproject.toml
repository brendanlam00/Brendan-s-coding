[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelbot"
version = "0.1.0"
description = "Auto-edit videos, post them as Instagram Trial Reels, and promote the top performer to your main feed."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
reelbot = "reelbot.cli:main"

[tool.setuptools]
packages = ["reelbot"]
